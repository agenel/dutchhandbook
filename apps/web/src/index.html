<!doctype html>
<html lang="en">
  <head>
    <meta charset="utf-8" />
    <title>More Dutch — Interactive Dutch Grammar Hub & Cheat Sheets</title>
    <base href="/" />
    <!-- Apply the saved theme before first paint so dark-mode users don't get a
         white flash on every load. Mirrors ThemeService (key: dgh_dark_mode). -->
    <script>
      (function () {
        try {
          var saved = localStorage.getItem('dgh_dark_mode');
          var dark = saved !== null
            ? saved === 'true'
            : window.matchMedia && matchMedia('(prefers-color-scheme: dark)').matches;
          if (dark) document.documentElement.setAttribute('data-theme', 'dark');
        } catch (e) {}
      })();
    </script>
    <meta name="viewport" content="width=device-width, initial-scale=1" />
    <meta name="description" content="The ultimate interactive hub for Dutch learners. Master A1-B1 grammar with 15+ cheat sheets, verb explorers, flashcards, and drills." />
    <meta name="author" content="soylu.dev" />
    <meta name="theme-color" content="#f5f0e8" media="(prefers-color-scheme: light)" />
    <meta name="theme-color" content="#1a1a1a" media="(prefers-color-scheme: dark)" />
    <meta name="referrer" content="strict-origin-when-cross-origin" />
    <link rel="canonical" href="https://moredutch.com/" />
    <link rel="alternate" hreflang="en" href="https://moredutch.com/" />
    <link rel="alternate" hreflang="x-default" href="https://moredutch.com/" />
    <link rel="icon" type="image/x-icon" href="favicon.ico" />
    <link rel="preconnect" href="https://fonts.googleapis.com" />
    <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin />
    <link
      href="https://fonts.googleapis.com/css2?family=Playfair+Display:ital,wght@0,700;0,900;1,700&family=DM+Sans:wght@300;400;500;600&family=DM+Mono:wght@400;500;600&display=swap"
      rel="preload"
      as="style"
      onload="this.onload=null;this.rel='stylesheet'"
    />
    <!-- Icons load as a normal stylesheet with display=block: an async icon font
         renders ligature names ("help_outline") as text first, which reflows the
         page (layout shift). The stylesheet is tiny; the font itself still loads async. -->
    <link
      href="https://fonts.googleapis.com/icon?family=Material+Icons&display=block"
      rel="stylesheet"
    />
    <noscript>
      <link
        href="https://fonts.googleapis.com/css2?family=Playfair+Display:ital,wght@0,700;0,900;1,700&family=DM+Sans:wght@300;400;500;600&family=DM+Mono:wght@400;500;600&display=swap"
        rel="stylesheet"
      />
    </noscript>
  </head>
  <body>
    <md-root></md-root>
  </body>
</html>
